<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script>
        function calculerSomme() {
            let n1 = document.getElementById("n1").value;
            let n2 = document.getElementById("n2").value;
            if (!isNaN(n1) && !isNaN(n2)) {
                let somme = parseFloat(n1) + parseFloat(n2);
                document.getElementById("res").value = somme;
            }else{
                alert("Veuillez entrer des nombres valides.");
            }
        }
    </script>
</head>
<body>
    <div class="container mt-5">
        <form action="#" onsubmit="calculerSomme()">
            <h1 class="text-center mb-4">somme de 2 nombres</h1>
            <div class="mb-3">
                <label for="n1" class="form-label">donner le premier nombre</label>
                <input type="text" class="form-control" id="n1">
            </div>
            <div class="mb-3">
                <label for="n2" class="form-label">donner le deuxieme nombre</label>
                <input type="text" class="form-control" id="n2">
            </div>
            <button type="submit" class="btn btn-primary w-100">Calculer la somme</button>
            <input type="number" id="res" class="form-control" readonly>
    </form>
    
</body>
</html>
